# Nginx configuration for CDN (Reverse Proxy with caching)
# BionicPro Assignment 3: S3 & CDN Cache

events {
    worker_connections 1024;
}

http {
    # Include MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    proxy_cache_path /var/cache/nginx 
                     levels=1:2 
                     keys_zone=reports_cache:10m 
                     max_size=1g 
                     inactive=60m 
                     use_temp_path=off;

    # MinIO upstream
    upstream minio {
        server minio:9000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Enable caching for this server
        proxy_cache reports_cache;
        
        # Cache static files (reports from MinIO)
        location /reports/ {
            # Proxy to MinIO S3 bucket
            proxy_pass http://minio/bionicpro-reports/;
            
            # Cache settings
            proxy_cache_valid 200 60m;      # Cache successful responses for 60 minutes
            proxy_cache_valid 404 1m;       # Cache 404 for 1 minute
            proxy_cache_valid any 5m;       # Cache other responses for 5 minutes
            
            # Use stale cache if backend is down
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            
            # Update cache in background
            proxy_cache_background_update on;
            
            # Only one request at a time can populate cache for same key
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            
            # Cache key (unique identifier for cached content)
            proxy_cache_key "$scheme$request_method$host$request_uri";
            
            # Bypass cache for certain conditions (optional)
            proxy_cache_bypass $http_pragma $http_authorization;
            proxy_no_cache $http_pragma $http_authorization;
            
            # Cache status header (for debugging)
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            
            # Proxy headers to MinIO
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Connection settings
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Enable CORS
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Nginx status (optional, for monitoring)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.0.0.0/8;  # Only from Docker network
            deny all;
        }
    }
}
